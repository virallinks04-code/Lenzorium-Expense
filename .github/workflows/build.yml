name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HAS_KEY: ${{ secrets.LENZORIUM_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The release key lives only in encrypted repository secrets, never in the code.
      - name: Restore signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.LENZORIUM_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "LENZORIUM_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "LENZORIUM_KEY_ALIAS=lenzorium" >> "$GITHUB_ENV"

      - name: Run calculation tests and render screenshots
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test-log.txt

      - name: Build release APK and Play Store bundle
        env:
          LENZORIUM_KEYSTORE_PASSWORD: ${{ secrets.LENZORIUM_KEYSTORE_PASSWORD }}
          LENZORIUM_KEY_PASSWORD: ${{ secrets.LENZORIUM_KEYSTORE_PASSWORD }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleRelease bundleRelease 2>&1 | tee build-log.txt

      - name: Collect outputs
        run: |
          mkdir -p out
          SUFFIX=$([ "$HAS_KEY" = "true" ] && echo "" || echo "-TEST-key")
          cp app/build/outputs/apk/release/app-release.apk "out/LenzoriumExpenses-build${{ github.run_number }}${SUFFIX}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/LenzoriumExpenses-build${{ github.run_number }}${SUFFIX}.aab"
          ls -la out

      # Screenshots, logs and test reports go to the "ci-output" branch for review.
      - name: Publish screenshots and logs
        if: always()
        run: |
          mkdir -p /tmp/ci/screens /tmp/ci/tests
          cp app/build/screenshots/*.png /tmp/ci/screens/ 2>/dev/null || true
          cp app/build/test-results/testDebugUnitTest/*.xml /tmp/ci/tests/ 2>/dev/null || true
          cp test-log.txt build-log.txt /tmp/ci/ 2>/dev/null || true
          echo "run ${{ github.run_number }} ${{ github.sha }} ${{ job.status }}" > /tmp/ci/RUN.txt
          cd /tmp/ci
          git init -q -b ci-output
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "CI output for run ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-output

      - name: Upload outputs
        uses: actions/upload-artifact@v4
        with:
          name: LenzoriumExpenses
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Lenzorium Expenses build ${{ github.run_number }}${{ env.HAS_KEY != 'true' && ' (test key)' || '' }}
          body: |
            **.apk** — install directly on an Android phone.
            **.aab** — upload this to Google Play Console.
            All calculation tests passed for this build.
            ${{ env.HAS_KEY != 'true' && 'Signed with a temporary test key: not for Google Play. Add the signing secrets for a permanently signed build.' || '' }}
          files: out/*
          prerelease: ${{ env.HAS_KEY != 'true' }}
          make_latest: ${{ env.HAS_KEY == 'true' }}
